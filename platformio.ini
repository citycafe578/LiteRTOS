; LiteRTOS - PlatformIO 設定
;
; 這個 repo 是 Arduino / PlatformIO 函式庫（src/），本檔只用來：
;   example : 把 examples/basic 編到 Uno 上（以本機函式庫方式引用 src/）
;   bench*  : testbench，LiteRTOS 與 FreeRTOS 的資源與速度比較
; 行為測試不走 PlatformIO，用 simavr：make test-all（見 Makefile）。
;
;   pio run -e example               編譯範例
;   pio run -e example -t upload     燒錄到 Uno

[platformio]
default_envs = example

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:example]
src_dir = examples/basic
lib_deps = symlink://.

; release 設定：-Os、無 assert。RAM/flash 的量測只能用這個設定的數字。
[env:release]
build_flags =
    ${env.build_flags}
    -DLITERTOS_RELEASE=1
    -DNDEBUG

; ---- testbench：LiteRTOS 與 FreeRTOS 的資源與速度比較 ----
;   python test/bench/report.py     編譯下面四個環境，列出 Flash / RAM 比較表
;   pio run -e bench    -t upload    LiteRTOS 速度 testbench（序列埠 115200 看結果）
;   pio run -e bench_fr -t upload    FreeRTOS 速度 testbench（同樣的量法）
; 全部沿用 release 的編譯設定，數字才和發布版一致。FreeRTOS 的來源由 test/bench/get_freertos.py 下載。
[env:bench_base]
build_flags = ${env:release.build_flags}
build_src_filter = -<*> +<../test/bench/base_main.c>

[env:bench_size]
build_flags = ${env:release.build_flags}
build_src_filter = -<*> +<LiteRTOS.c> +<LiteRTOS_port_avr.c> +<PortInitStack.S> +<uxTaskGetStackHighWaterMark.S> +<../test/bench/size_main.c>

[env:bench]
build_flags = ${env:release.build_flags}
build_src_filter = -<*> +<LiteRTOS.c> +<LiteRTOS_port_avr.c> +<PortInitStack.S> +<uxTaskGetStackHighWaterMark.S> +<../test/bench/bench_main.c>

; FreeRTOS 最小設定：合作式、靜態配置，功能對等於 LiteRTOS
[env:bench_fr_size]
build_flags =
    ${env:release.build_flags}
    -Itest/bench/freertos/kernel_min
build_src_filter = -<*> +<../test/bench/freertos/fr_size_min.c> +<../test/bench/freertos/kernel_min/tasks.c> +<../test/bench/freertos/kernel_min/list.c> +<../test/bench/freertos/kernel_min/queue.c> +<../test/bench/freertos/kernel_min/port.c> +<../test/bench/freertos/kernel_min/heap_3.c>

[env:bench_fr]
build_flags =
    ${env:release.build_flags}
    -Itest/bench/freertos/kernel_min
build_src_filter = -<*> +<../test/bench/freertos/fr_bench_main.c> +<../test/bench/freertos/kernel_min/tasks.c> +<../test/bench/freertos/kernel_min/list.c> +<../test/bench/freertos/kernel_min/queue.c> +<../test/bench/freertos/kernel_min/port.c> +<../test/bench/freertos/kernel_min/heap_3.c>

; FreeRTOS 預設設定：套件原本的設定（搶佔式、timer task、mutex、動態配置）
[env:bench_fr_stock_size]
build_flags =
    ${env:release.build_flags}
    -Itest/bench/freertos/kernel_stock
build_src_filter = -<*> +<../test/bench/freertos/fr_size_stock.c> +<../test/bench/freertos/kernel_stock/tasks.c> +<../test/bench/freertos/kernel_stock/list.c> +<../test/bench/freertos/kernel_stock/queue.c> +<../test/bench/freertos/kernel_stock/port.c> +<../test/bench/freertos/kernel_stock/heap_3.c> +<../test/bench/freertos/kernel_stock/timers.c> +<../test/bench/freertos/kernel_stock/variantHooks.cpp>
